name: Fix empty-note aggregate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-empty-note-aggregate.yml

permissions:
  contents: write

env:
  META_PATH: .github/empty-note-fix
  CI: "true"

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record run metadata
        run: |
          set -euo pipefail
          mkdir -p "$META_PATH"
          printf '%s\n' "${{ github.run_id }}" > "$META_PATH/run-id.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$META_PATH"
          git commit -m 'chore: record empty-note fix validation run'
          git push

      - name: Apply Core fix directly to master
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/core/src/modules/note/note.service.ts')
          text = path.read_text()
          old = """  async getLatestNoteId() {\n    const note = await this.noteRepository.getLatestVisible()\n    if (!note) throw createAppException(AppErrorCode.NOT_FOUND)\n    return { nid: note.nid, id: note.id }\n  }"""
          new = """  async getLatestNoteId() {\n    const note = await this.noteRepository.getLatestVisible()\n    if (!note) return null\n    return { nid: note.nid, id: note.id }\n  }"""
          if old not in text:
              raise SystemExit('target code was not found or was already changed')
          path.write_text(text.replace(old, new, 1))
          PY
          git add apps/core/src/modules/note/note.service.ts
          git commit -m 'fix: allow aggregate on sites without notes'
          git push

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck Core
        run: pnpm -C apps/core run typecheck

      - name: Bundle Core
        run: pnpm -C apps/core run build
