name: Cleanup architecture audit

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/architecture-audit.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/architecture-audit
          rm -f .github/workflows/architecture-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github
          git commit -m 'chore: remove temporary architecture audit'
          git push
