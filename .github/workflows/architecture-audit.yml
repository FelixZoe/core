name: Core API surface audit

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/architecture-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect current API surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/architecture-audit
          find packages/api-client apps/core/src \
            -type f \
            -not -path '*/node_modules/*' \
            | sort > .github/architecture-audit/api-tree.txt

          : > .github/architecture-audit/api-surface.txt
          while IFS= read -r file; do
            case "$file" in
              *.ts|*.mjs|*.json)
                if grep -Eiq 'upload|objects|files|owner|auth|aggregate|search|socket|gateway|comments|subscribe|recently|api/v3' "$file"; then
                  printf '\n===== FILE: %s =====\n' "$file" >> .github/architecture-audit/api-surface.txt
                  cat "$file" >> .github/architecture-audit/api-surface.txt
                  printf '\n' >> .github/architecture-audit/api-surface.txt
                fi
                ;;
            esac
          done < .github/architecture-audit/api-tree.txt
      - name: Commit audit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/architecture-audit
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record current Core v3 API surface'
          git push
