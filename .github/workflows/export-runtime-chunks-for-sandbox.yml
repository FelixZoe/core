name: Export split runtimes for sandbox

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-runtime-chunks-for-sandbox.yml

permissions:
  contents: write

env:
  META_PATH: .github/runtime-chunks-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record run metadata
        run: |
          set -euo pipefail
          mkdir -p "$META_PATH"
          printf '%s\n' "${{ github.run_id }}" > "$META_PATH/run-id.txt"
          printf '%s\n' "${{ github.sha }}" > "$META_PATH/source-sha.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$META_PATH"
          git commit -m 'chore: record split runtime export run'
          git push

      - name: Export and split root filesystems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-export

          docker pull innei/mx-server:latest
          docker image inspect innei/mx-server:latest > runtime-export/core-inspect.json
          cid=$(docker create innei/mx-server:latest)
          docker export "$cid" | gzip -1 > runtime-export/core-rootfs.tar.gz
          docker rm "$cid"
          split -b 240M runtime-export/core-rootfs.tar.gz runtime-export/core-rootfs.part-
          rm runtime-export/core-rootfs.tar.gz

          docker pull postgres:16-alpine
          docker image inspect postgres:16-alpine > runtime-export/postgres-inspect.json
          cid=$(docker create postgres:16-alpine)
          docker export "$cid" | gzip -1 > runtime-export/postgres-rootfs.tar.gz
          docker rm "$cid"

          docker pull redis:7-alpine
          docker image inspect redis:7-alpine > runtime-export/redis-inspect.json
          cid=$(docker create redis:7-alpine)
          docker export "$cid" | gzip -1 > runtime-export/redis-rootfs.tar.gz
          docker rm "$cid"

          sha256sum runtime-export/* > runtime-export/SHA256SUMS
          ls -lh runtime-export

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-metadata
          path: |
            runtime-export/*-inspect.json
            runtime-export/SHA256SUMS
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('runtime-export/core-rootfs.part-aa') != '' }}
        with:
          name: core-rootfs-aa
          path: runtime-export/core-rootfs.part-aa
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('runtime-export/core-rootfs.part-ab') != '' }}
        with:
          name: core-rootfs-ab
          path: runtime-export/core-rootfs.part-ab
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('runtime-export/core-rootfs.part-ac') != '' }}
        with:
          name: core-rootfs-ac
          path: runtime-export/core-rootfs.part-ac
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('runtime-export/core-rootfs.part-ad') != '' }}
        with:
          name: core-rootfs-ad
          path: runtime-export/core-rootfs.part-ad
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('runtime-export/core-rootfs.part-ae') != '' }}
        with:
          name: core-rootfs-ae
          path: runtime-export/core-rootfs.part-ae
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: postgres-rootfs
          path: runtime-export/postgres-rootfs.tar.gz
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: redis-rootfs
          path: runtime-export/redis-rootfs.tar.gz
          compression-level: 0
          retention-days: 1
