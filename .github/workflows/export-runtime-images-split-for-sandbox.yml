name: Export split runtime images for sandbox

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-runtime-images-split-for-sandbox.yml

permissions:
  contents: write

env:
  META_PATH: .github/runtime-images-split-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record run metadata
        run: |
          set -euo pipefail
          mkdir -p "$META_PATH"
          printf '%s\n' "${{ github.run_id }}" > "$META_PATH/run-id.txt"
          printf '%s\n' "${{ github.sha }}" > "$META_PATH/source-sha.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$META_PATH"
          git commit -m 'chore: record split sandbox image export run'
          git push

      - name: Export image root filesystems
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-split /tmp/runtime-small

          docker pull innei/mx-server:latest
          docker image inspect innei/mx-server:latest > /tmp/runtime-small/core-inspect.json
          cid=$(docker create innei/mx-server:latest)
          docker export "$cid" | gzip -1 > /tmp/core-rootfs.tar.gz
          docker rm "$cid"
          split -b 240M -d -a 2 /tmp/core-rootfs.tar.gz /tmp/runtime-split/core-part-
          for n in 00 01 02 03; do touch "/tmp/runtime-split/core-part-$n"; done

          for spec in postgres=postgres:16-alpine redis=redis:7-alpine
          do
            name=${spec%%=*}
            image=${spec#*=}
            docker pull "$image"
            docker image inspect "$image" > "/tmp/runtime-small/${name}-inspect.json"
            cid=$(docker create "$image")
            docker export "$cid" | gzip -1 > "/tmp/runtime-small/${name}-rootfs.tar.gz"
            docker rm "$cid"
          done

          du -h /tmp/core-rootfs.tar.gz /tmp/runtime-split/* /tmp/runtime-small/*

      - uses: actions/upload-artifact@v4
        with:
          name: core-part-00
          path: /tmp/runtime-split/core-part-00
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: core-part-01
          path: /tmp/runtime-split/core-part-01
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: core-part-02
          path: /tmp/runtime-split/core-part-02
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: core-part-03
          path: /tmp/runtime-split/core-part-03
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: database-runtime
          path: /tmp/runtime-small
          compression-level: 0
          retention-days: 1
