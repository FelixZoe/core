name: API client inventory

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/api-client-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Export compatibility source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/api-client-inventory
          find packages/api-client -type f -not -path '*/node_modules/*' | sort > .github/api-client-inventory/tree.txt
          : > .github/api-client-inventory/source.txt
          while IFS= read -r file; do
            case "$file" in
              *.ts|*.tsx|*.json|*.md|*.mjs)
                printf '\n===== FILE: %s =====\n' "$file" >> .github/api-client-inventory/source.txt
                cat "$file" >> .github/api-client-inventory/source.txt
                printf '\n' >> .github/api-client-inventory/source.txt
                ;;
            esac
          done < .github/api-client-inventory/tree.txt

          : > .github/api-client-inventory/comment-backend.txt
          find apps/core/src -type f -iname '*comment*' | sort | while IFS= read -r file; do
            printf '\n===== FILE: %s =====\n' "$file" >> .github/api-client-inventory/comment-backend.txt
            cat "$file" >> .github/api-client-inventory/comment-backend.txt
            printf '\n' >> .github/api-client-inventory/comment-backend.txt
          done

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/api-client-inventory
          git diff --cached --quiet && exit 0
          git commit -m 'chore: generate api client inventory'
          git push
