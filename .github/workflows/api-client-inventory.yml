name: Remove API inventory

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/api-client-inventory.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove temporary inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/api-client-inventory \
            .github/workflows/api-client-inventory.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove api inventory diagnostics'
          git push
